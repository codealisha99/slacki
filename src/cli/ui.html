<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>slacki</title>
    <style>
      /* Slacki design system: semantic tokens, shared controls, responsive workspace. */
      :root {
        color-scheme: light;
        --canvas: #f5f6f8;
        --surface: #ffffff;
        --subtle: #eef0f4;
        --text: #202631;
        --muted: #657084;
        --border: #e1e5eb;
        --accent: #5054c7;
        --accent-soft: #eeedfc;
        --accent-text: #4445ac;
        --success: #237354;
        --danger: #b33844;
        --warning: #966014;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #191b23;
        --surface: #20232d;
        --subtle: #2a2e3b;
        --text: #e9ebf3;
        --muted: #a4adc0;
        --border: #343949;
        --accent: #a5a4ff;
        --accent-soft: #323152;
        --accent-text: #c2c0ff;
        --success: #7dd9ac;
        --danger: #ff99a4;
        --warning: #ebc07c;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--canvas);
        color: var(--text);
        font: 14px/1.5 var(--font);
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr);
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
      }
      button,
      input,
      textarea {
        border-radius: var(--radius-sm);
      }
      button {
        transition:
          background 120ms,
          color 120ms;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .top {
        display: flex;
        flex-direction: column;
        padding: 28px 14px 16px;
        border-right: 1px solid var(--border);
        gap: 28px;
        min-width: 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
      }
      .brand-icon {
        display: grid;
        place-items: center;
        background: var(--accent);
        color: var(--surface);
        width: 32px;
        height: 32px;
        border-radius: 10px;
        font-size: 22px;
        font-weight: 700;
      }
      .mark {
        font-size: 25px;
        font-weight: 750;
        letter-spacing: -1.2px;
      }
      .workspace {
        margin: 0 8px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--border);
      }
      .workspace-label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 5px;
      }
      #workspace-name {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        text-align: left;
        color: var(--muted);
        font-weight: 500;
      }
      .nav button:hover,
      .ghost:hover {
        background: var(--subtle);
      }
      .nav button.active {
        color: var(--accent-text);
        background: var(--accent-soft);
      }
      .icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      .sidebar-bottom {
        margin-top: auto;
        display: grid;
        gap: 14px;
        padding: 0 8px;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .connection {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--muted);
      }
      .connection::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
      }
      .shell {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr);
        min-height: 0;
        min-width: 0;
      }
      .shell.solo {
        grid-template-columns: minmax(0, 1fr);
      }
      .queue {
        border-right: 1px solid var(--border);
        overflow: auto;
        background: var(--surface);
      }
      .queue-heading {
        padding: 28px 24px 20px;
      }
      h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.5px;
        font-weight: 650;
      }
      .subheading {
        color: var(--muted);
        margin: 6px 0 0;
        font-size: 12px;
      }
      #queue {
        padding: 0 12px 20px;
      }
      .ticket {
        display: block;
        width: 100%;
        text-align: left;
        padding: 15px 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        margin-bottom: 4px;
      }
      .ticket:hover {
        background: var(--canvas);
      }
      .ticket.active {
        background: var(--accent-soft);
        border-color: color-mix(in srgb, var(--accent) 20%, transparent);
      }
      .ticket-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
        font-weight: 600;
      }
      .ticket-top > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .count {
        font-size: 11px;
        color: var(--accent-text);
        white-space: nowrap;
      }
      .mention .count {
        font-weight: 700;
      }
      .snippet {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin-top: 6px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .find {
        display: flex;
        gap: 6px;
        padding: 0 24px 18px;
      }
      .find input {
        min-width: 0;
        width: 100%;
        background: var(--canvas);
        border: 1px solid var(--border);
        padding: 9px 10px;
      }
      .tape {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-width: 0;
        min-height: 0;
        background: var(--surface);
      }
      .tape-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        min-height: 99px;
        border-bottom: 1px solid var(--border);
        padding: 20px 32px;
      }
      .tape-head h2 {
        font-size: 17px;
        overflow-wrap: anywhere;
      }
      .head-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .msgs {
        overflow: auto;
        padding: 24px 0;
      }
      .row {
        position: relative;
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        column-gap: 12px;
        padding: 12px 32px;
      }
      .avatar {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 650;
        font-size: 12px;
        border-radius: var(--radius-md);
        grid-row: 1 / 3;
      }
      .message-meta {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 4px;
      }
      .ts {
        color: var(--muted);
        font-size: 11px;
      }
      .who {
        font-weight: 650;
        font-size: 13px;
      }
      .body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 14px;
        line-height: 1.65;
        max-width: 78ch;
      }
      .thread-tag {
        display: block;
        color: var(--accent-text);
        font-size: 12px;
        padding: 4px 0;
        margin-top: 6px;
      }
      .thread-tag:hover {
        text-decoration: underline;
      }
      .composer {
        margin: 8px 28px 24px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .composer:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .composer-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      textarea {
        width: 100%;
        min-height: 84px;
        max-height: 220px;
        resize: vertical;
        background: transparent;
        border: 0;
        padding: 10px 0;
        line-height: 1.6;
      }
      textarea:focus-visible {
        outline: none;
      }
      textarea::placeholder,
      input::placeholder {
        color: var(--muted);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .go,
      .ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        min-height: 34px;
      }
      .go {
        background: var(--accent);
        color: var(--surface);
      }
      .go:hover:not(:disabled) {
        filter: brightness(0.94);
      }
      .ghost {
        border: 1px solid var(--border);
        color: var(--muted);
      }
      #send {
        margin-left: auto;
      }
      .status {
        color: var(--muted);
        font-size: 12px;
        padding: 0 32px 12px;
        margin: 0;
        min-height: 30px;
      }
      .status.err,
      .error-banner {
        color: var(--danger);
      }
      .empty {
        color: var(--muted);
        padding: 16px 12px;
        font-size: 13px;
      }
      .welcome {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
      }
      .welcome-icon {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: var(--accent-soft);
        color: var(--accent-text);
        margin-bottom: 24px;
      }
      .welcome-icon .icon {
        width: 28px;
        height: 28px;
      }
      .welcome h3 {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.7px;
      }
      .welcome p {
        max-width: 35ch;
        color: var(--muted);
        margin: 0;
        line-height: 1.7;
      }
      .welcome kbd {
        font: 11px var(--font);
        border: 1px solid var(--border);
        padding: 3px 5px;
        border-radius: 4px;
      }
      .welcome .hint {
        margin-top: 28px;
        font-size: 12px;
      }
      .report {
        padding: 8px 32px 32px;
        max-width: 900px;
      }
      .report h3 {
        font-size: 15px;
        margin: 20px 0 12px;
      }
      .report li {
        margin-bottom: 8px;
      }
      .report pre {
        font: 12px/1.7 var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--canvas);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 20px;
      }
      .error-banner {
        padding: 24px 32px;
        overflow-wrap: anywhere;
      }
      .amber {
        color: var(--warning);
      }
      .mobile-back {
        display: none;
      }
      @media (max-width: 1100px) {
        body {
          grid-template-columns: 176px minmax(0, 1fr);
        }
        .shell {
          grid-template-columns: 270px minmax(0, 1fr);
        }
        .row {
          padding-inline: 24px;
        }
        .tape-head {
          padding-inline: 24px;
        }
      }
      @media (max-width: 760px) {
        body {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr);
          height: 100dvh;
        }
        .top {
          padding: 12px;
          gap: 12px;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        .brand {
          padding: 0 4px;
        }
        .mark {
          font-size: 22px;
        }
        .brand-icon {
          width: 28px;
          height: 28px;
        }
        .workspace,
        .sidebar-bottom {
          display: none;
        }
        .nav {
          display: flex;
          justify-content: space-between;
          gap: 2px;
        }
        .nav button {
          padding: 8px;
          gap: 6px;
          font-size: 12px;
        }
        .nav .icon {
          width: 15px;
        }
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
        .tape {
          display: none;
        }
        .shell.conversation-open .queue {
          display: none;
        }
        .shell.conversation-open .tape,
        .shell.solo .tape {
          display: grid;
        }
        .mobile-back {
          display: inline-flex;
        }
        .tape-head {
          min-height: 76px;
          padding: 14px 16px;
        }
        .head-actions {
          gap: 4px;
        }
        .tape-head h2 {
          font-size: 15px;
        }
        .row {
          padding: 12px 16px;
        }
        .composer {
          margin: 8px 12px 12px;
        }
        .status {
          padding-inline: 16px;
        }
      }
      @media (max-width: 760px) {
        .nav {
          display: grid;
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
        .nav button {
          flex-direction: column;
          justify-content: center;
          padding: 7px 2px;
          gap: 4px;
        }
        .head-actions {
          flex-wrap: wrap;
          justify-content: flex-end;
        }
        .tape-head > div:first-child {
          min-width: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">s</span>
        <div class="mark">slacki</div>
      </div>
      <div class="workspace">
        <div class="workspace-label">Your workspace</div>
        <div id="workspace-name">Connecting…</div>
      </div>
      <nav class="nav" id="nav" aria-label="Workspace">
        <button type="button" data-view="inbox" class="active" aria-current="page">
          <span data-icon="inbox"></span>Inbox
        </button>
        <button type="button" data-view="channels"><span data-icon="hash"></span>Channels</button>
        <button type="button" data-view="search"><span data-icon="search"></span>Search</button>
        <button type="button" data-view="later"><span data-icon="bookmark"></span>Later</button>
        <button type="button" data-view="doctor"><span data-icon="pulse"></span>Doctor</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="ghost" id="theme" type="button">Switch theme</button>
        <div class="connection">Local workspace</div>
        <div class="meta" id="meta">Connecting to Slack…</div>
      </div>
    </header>
    <main class="shell" id="shell">
      <aside class="queue" id="sidebar" aria-label="Conversations">
        <div class="queue-heading">
          <h2 id="queue-label">Inbox</h2>
          <p class="subheading" id="queue-description">A little less noise. A little more focus.</p>
        </div>
        <form class="find" id="search-box" hidden>
          <input
            id="search-q"
            aria-label="Search messages"
            type="search"
            placeholder="Search your workspace…"
            autocomplete="off"
          />
          <button class="go" type="submit">Search</button>
        </form>
        <div id="queue"><p class="empty">Loading conversations…</p></div>
      </aside>
      <section class="tape" aria-label="Conversation">
        <div class="tape-head">
          <div>
            <h2 id="tape-title">Your space to catch up</h2>
            <p class="subheading" id="tape-description">
              Stay close to the conversations that matter.
            </p>
          </div>
          <div class="head-actions">
            <button
              class="ghost mobile-back"
              id="back"
              type="button"
              aria-label="Back to conversations"
            >
              Back</button
            ><button class="ghost" id="thread-back" type="button" hidden>Conversation</button
            ><button class="ghost" type="button" id="refresh">
              <span data-icon="refresh"></span>Refresh
            </button>
          </div>
        </div>
        <div class="msgs" id="msgs"></div>
        <div>
          <form class="composer" id="composer" hidden>
            <label class="composer-label" for="draft" id="draft-label">Reply to conversation</label>
            <textarea id="draft" placeholder="Write a thoughtful reply…" disabled></textarea>
            <div class="actions">
              <button class="ghost" type="button" id="mark" disabled>
                <span data-icon="check"></span>Mark read</button
              ><button class="ghost" type="button" id="later" disabled>
                <span data-icon="bookmark"></span>Save for later</button
              ><button class="go" type="submit" id="send" disabled>
                Send message <span data-icon="send"></span>
              </button>
            </div>
          </form>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script>
      const CONFIG = __INBOX_CONFIG__;
      const token = CONFIG.token;
      const state = {
        view: "inbox",
        session: null,
        tickets: [],
        selected: null,
        messages: [],
        mode: "history",
        threadTs: null,
      };

      const paths = {
        inbox: "M4 4h16v16H4z M4 13h5l2 3h2l2-3h5",
        hash: "M9 3 7 21 M17 3l-2 18 M3 9h18 M2 15h18",
        search: "M21 21l-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0",
        bookmark: "M6 3h12v18l-6-4-6 4z",
        pulse: "M3 12h4l3-8 4 16 3-8h4",
        refresh: "M20 7v5h-5 M4 17v-5h5 M5 8a8 8 0 0 1 13-3l2 3 M4 16l2 3a8 8 0 0 0 13-3",
        check: "m5 12 4 4L19 6",
        send: "m3 3 18 9-18 9 4-9z M7 12h14",
      };
      function icon(name) {
        return (
          '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' +
          paths[name] +
          '"></path></svg>'
        );
      }
      document.querySelectorAll("[data-icon]").forEach((el) => {
        el.innerHTML = icon(el.dataset.icon);
      });
      let savedTheme;
      try {
        savedTheme = localStorage.getItem("slacki-theme");
      } catch {}
      document.documentElement.dataset.theme =
        savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.getElementById("theme").addEventListener("click", () => {
        const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        try {
          localStorage.setItem("slacki-theme", theme);
        } catch {}
      });
      document
        .getElementById("back")
        .addEventListener("click", () =>
          document.getElementById("shell").classList.remove("conversation-open"),
        );
      document
        .getElementById("thread-back")
        .addEventListener("click", () => openChannel(state.selected));
      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "k") {
          event.preventDefault();
          document.querySelector('[data-view="search"]').click();
          document.getElementById("search-q").focus();
        }
      });
      let messageRequest = 0;
      let viewRequest = 0;
      const drafts = new Map();
      const pendingSends = new Set();
      function draftKey() {
        return state.selected ? state.selected.channel_id + ":" + (state.threadTs || "") : "";
      }
      function saveDraft() {
        if (draftKey()) drafts.set(draftKey(), document.getElementById("draft").value);
      }
      function restoreDraft() {
        document.getElementById("draft").value = drafts.get(draftKey()) || "";
      }

      function headers(extra) {
        return { "x-inbox-token": token, ...(extra || {}) };
      }

      async function api(path, init) {
        const res = await fetch(path, { ...init, headers: headers(init && init.headers) });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || res.statusText);
        }
        return data;
      }

      function clock(ts) {
        if (!ts) return "";
        const ms = Number.parseFloat(ts) * 1000;
        if (!Number.isFinite(ms)) return ts;
        return new Date(ms).toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function channelLabel(ch) {
        if (!ch) return "";
        if (ch.channel_type === "dm") return ch.channel_name || "direct";
        return ch.channel_name ? "#" + ch.channel_name : ch.channel_id;
      }

      function lastSnippet(ch) {
        if (ch.snippet) return ch.snippet;
        const msgs = ch.messages || [];
        const last = msgs[msgs.length - 1];
        return last && last.content ? last.content : "";
      }

      function setStatus(text, err) {
        const el = document.getElementById("status");
        el.textContent = text || "";
        el.className = "status" + (err ? " err" : "");
      }

      function emptyCopy() {
        if (state.view === "channels") return "No conversations returned.";
        if (state.view === "search")
          return "Find a message with a keyword, or try in:channel or from:name.";
        if (state.view === "later")
          return "Nothing saved yet. Save a message from a conversation to return to it here.";
        return "You’re all caught up. Refresh to check for new conversations.";
      }

      function renderQueue() {
        const root = document.getElementById("queue");
        if (state.view === "doctor") {
          root.replaceChildren();
          return;
        }
        if (!state.tickets.length) {
          const p = document.createElement("p");
          p.className = "empty";
          p.textContent = emptyCopy();
          root.replaceChildren(p);
          return;
        }
        root.replaceChildren(
          ...state.tickets.map((ch) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className =
              "ticket" +
              (state.selected && state.selected.channel_id === ch.channel_id && !ch.ts
                ? " active"
                : "") +
              (state.selected && ch.ts && state.selected.ts === ch.ts ? " active" : "") +
              (ch.mention_count > 0 ? " mention" : "");
            btn.innerHTML =
              '<div class="ticket-top"><span></span><span class="count"></span></div><div class="snippet"></div>';
            btn.querySelector(".ticket-top span").textContent = channelLabel(ch);
            btn.setAttribute("aria-pressed", String(btn.classList.contains("active")));
            btn.querySelector(".count").textContent = ch.count === "0" ? "" : ch.count || "";
            btn.querySelector(".snippet").textContent = lastSnippet(ch);
            btn.addEventListener("click", () => openChannel(ch));
            return btn;
          }),
        );
      }

      function renderTape() {
        if (state.view === "doctor") return;
        const title = document.getElementById("tape-title");
        const msgs = document.getElementById("msgs");
        const ch = state.selected;
        title.textContent = ch ? channelLabel(ch) : "Your space to catch up";
        document.getElementById("tape-description").textContent = ch
          ? state.mode === "thread"
            ? "Thread · replies stay in this conversation"
            : "Conversation history"
          : "Stay close to the conversations that matter.";
        document.getElementById("thread-back").hidden = state.mode !== "thread" || !ch;
        document.getElementById("composer").hidden = !ch;
        document.getElementById("draft-label").textContent =
          state.mode === "thread" ? "Reply to thread" : "Message " + channelLabel(ch);
        if (!state.messages.length) {
          msgs.innerHTML =
            '<div class="welcome"><div class="welcome-icon">' +
            icon(ch ? "hash" : "inbox") +
            '</div><h3></h3><p></p><p class="hint">Search your workspace with <kbd>⌘ / Ctrl K</kbd></p></div>';
          msgs.querySelector("h3").textContent = ch
            ? "Start the conversation"
            : "Make room for what matters.";
          msgs.querySelector(".welcome > p").textContent = ch
            ? "No messages here yet. Write the first one below."
            : "Choose a conversation to catch up, reply, and move on with your day.";
          return;
        }
        msgs.replaceChildren(
          ...state.messages.map((m) => {
            const row = document.createElement("article");
            const threaded = Boolean(m.thread_ts);
            row.className = "row" + (threaded ? " threadable" : "");
            const author =
              (m.author &&
                (m.author.display_name || m.author.name || m.author.user_id || m.author.bot_id)) ||
              "Unknown author";
            row.innerHTML =
              '<div class="avatar" aria-hidden="true"></div><div><div class="message-meta"><span class="who"></span><time class="ts"></time></div><div class="body"></div>' +
              (m.thread_ts ? '<button type="button" class="thread-tag"></button>' : "") +
              "</div>";
            row.querySelector(".avatar").textContent = author
              .replace(/[^a-z0-9]/gi, "")
              .slice(0, 2)
              .toUpperCase();
            row.querySelector(".ts").textContent = clock(m.ts);
            row.querySelector(".who").textContent = author;
            row.querySelector(".body").textContent = m.content || "";
            if (m.thread_ts) {
              const tag = row.querySelector(".thread-tag");
              tag.textContent =
                state.mode === "thread"
                  ? "in thread"
                  : m.ts === m.thread_ts
                    ? "open thread"
                    : "part of a thread — click to open";
              tag.addEventListener("click", () => openThread(ch.channel_id, m.thread_ts || m.ts));
            }
            return row;
          }),
        );
        msgs.scrollTop = msgs.scrollHeight;
      }

      function enableComposer(on) {
        document.getElementById("draft").disabled = !on;
        document.getElementById("send").disabled = !on || pendingSends.has(draftKey());
        document.getElementById("mark").disabled = !on;
        document.getElementById("later").disabled = !on;
      }

      function setView(view) {
        saveDraft();
        messageRequest++;
        viewRequest++;
        state.view = view;
        document.getElementById("shell").classList.remove("conversation-open");
        document.getElementById("thread-back").hidden = true;
        document.getElementById("queue-description").textContent = {
          inbox: "A little less noise. A little more focus.",
          channels: "All your conversations, in one place.",
          search: "Find the conversation you need.",
          later: "Pick up where you left off.",
          doctor: "",
        }[view];
        document.querySelectorAll("#nav button").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.view === view);
          if (btn.dataset.view === view) btn.setAttribute("aria-current", "page");
          else btn.removeAttribute("aria-current");
        });
        document.getElementById("search-box").hidden = view !== "search";
        document.getElementById("composer").hidden = view === "doctor";
        document.getElementById("sidebar").hidden = view === "doctor";
        document.getElementById("shell").classList.toggle("solo", view === "doctor");
        document.getElementById("queue-label").textContent =
          view === "inbox"
            ? "Inbox"
            : view === "channels"
              ? "Channels"
              : view === "search"
                ? "Results"
                : view === "later"
                  ? "Later"
                  : "Doctor";
      }

      async function loadSession() {
        state.session = await api("/api/session");
        document.getElementById("workspace-name").textContent =
          state.session.team || state.session.workspace_url || "Slack workspace";
        document.getElementById("meta").textContent = [
          state.session.user ? "@" + state.session.user : "",
          state.session.safe_mode ? "Safe mode enabled" : "Connected to Slack",
        ]
          .filter(Boolean)
          .join(" · ");
      }

      function ticketFromChannel(ch) {
        const mention = ch.mention_count ? ch.mention_count + " @ · " : "";
        const unread = ch.unread_count != null ? String(ch.unread_count) : "";
        return {
          ...ch,
          count: mention + unread,
          snippet: lastSnippet(ch),
        };
      }

      async function loadInbox() {
        const request = ++viewRequest;
        const data = await api("/api/unreads");
        if (request !== viewRequest) return;
        state.tickets = (data.channels || []).map(ticketFromChannel);
        document.getElementById("queue-label").textContent =
          data.source === "recent" ? "Recent conversations" : "Inbox";
        renderQueue();
      }

      async function loadChannels() {
        const request = ++viewRequest;
        const data = await api("/api/channels");
        if (request !== viewRequest) return;
        state.tickets = (data.channels || []).map(ticketFromChannel);
        renderQueue();
      }

      async function loadSearch(query) {
        const request = ++viewRequest;
        const data = await api("/api/search?q=" + encodeURIComponent(query));
        if (request !== viewRequest) return;
        state.tickets = (data.messages || []).map((m) => ({
          channel_id: m.channel_id,
          channel_name: m.channel_id,
          channel_type: "channel",
          ts: m.ts,
          snippet: m.content || "",
          count: clock(m.ts),
        }));
        renderQueue();
      }

      async function loadLater() {
        const request = ++viewRequest;
        const data = await api("/api/later");
        if (request !== viewRequest) return;
        state.tickets = (data.items || []).map((item) => ({
          channel_id: item.channel_id,
          channel_name: item.channel_name,
          channel_type: "channel",
          ts: item.ts,
          snippet: item.message && item.message.content ? item.message.content : "",
          count: clock(item.ts),
        }));
        renderQueue();
      }

      function renderDoctor(report) {
        document.getElementById("tape-title").textContent = "Doctor";
        const root = document.createElement("div");
        root.className = "report";
        const next = Array.isArray(report.next) ? report.next : [];
        const h = document.createElement("h3");
        h.textContent = "Next";
        root.appendChild(h);
        const ul = document.createElement("ul");
        if (!next.length) {
          const li = document.createElement("li");
          li.textContent = "Looks configured.";
          ul.appendChild(li);
        } else {
          next.forEach((step) => {
            const li = document.createElement("li");
            li.textContent = String(step);
            ul.appendChild(li);
          });
        }
        root.appendChild(ul);
        const facts = document.createElement("h3");
        facts.textContent = "Report";
        root.appendChild(facts);
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(report, null, 2);
        root.appendChild(pre);
        document.getElementById("msgs").replaceChildren(root);
        enableComposer(false);
      }

      async function loadDoctor() {
        const request = ++viewRequest;
        const report = await api("/api/doctor");
        if (request === viewRequest) renderDoctor(report);
      }

      async function loadView() {
        if (state.view === "inbox") await loadInbox();
        else if (state.view === "channels") await loadChannels();
        else if (state.view === "later") await loadLater();
        else if (state.view === "doctor") await loadDoctor();
        else {
          const query = document.getElementById("search-q").value.trim();
          if (query) await loadSearch(query);
          else renderQueue();
        }
      }

      async function openChannel(ch) {
        if (!ch) return;
        saveDraft();
        const request = ++messageRequest;
        state.selected = ch;
        state.messages = [];
        document.getElementById("shell").classList.add("conversation-open");
        state.mode = "history";
        state.threadTs = null;
        restoreDraft();
        enableComposer(false);
        renderQueue();
        renderTape();
        document.getElementById("msgs").innerHTML = '<p class="empty">Loading conversation…</p>';
        setStatus("Loading conversation…");
        try {
          const data = await api("/api/history?channel=" + encodeURIComponent(ch.channel_id));
          if (request !== messageRequest) return;
          state.messages = data.messages || [];
          enableComposer(true);
          renderTape();
          setStatus("");
        } catch (err) {
          if (request !== messageRequest) return;
          document.getElementById("msgs").innerHTML =
            '<p class="error-banner">Could not load messages. Use Refresh to try again.</p>';
          setStatus(String(err.message || err), true);
        }
      }

      async function openThread(channelId, ts) {
        saveDraft();
        const request = ++messageRequest;
        enableComposer(false);
        state.mode = "thread";
        state.threadTs = ts;
        restoreDraft();
        renderTape();
        document.getElementById("msgs").innerHTML = '<p class="empty">Loading thread…</p>';
        setStatus("Loading thread…");
        try {
          const data = await api(
            "/api/thread?channel=" +
              encodeURIComponent(channelId) +
              "&ts=" +
              encodeURIComponent(ts),
          );
          if (request !== messageRequest) return;
          state.messages = data.messages || [];
          enableComposer(true);
          renderTape();
          setStatus("replying in thread");
        } catch (err) {
          if (request !== messageRequest) return;
          document.getElementById("msgs").innerHTML =
            '<p class="error-banner">Could not load messages. Use Refresh to try again.</p>';
          setStatus(String(err.message || err), true);
        }
      }

      document.getElementById("nav").addEventListener("click", async (event) => {
        const btn = event.target.closest("button[data-view]");
        if (!btn) return;
        setView(btn.dataset.view);
        state.tickets = [];
        renderQueue();
        state.messages = [];
        state.selected = null;
        state.threadTs = null;
        if (state.view === "doctor")
          document.getElementById("msgs").innerHTML =
            '<p class="empty">Checking your connection…</p>';
        if (state.view !== "doctor") {
          enableComposer(false);
          renderTape();
        }
        setStatus("");
        try {
          await loadView();
        } catch (err) {
          setStatus(String(err.message || err), true);
        }
      });

      document.getElementById("search-box").addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = document.getElementById("search-q").value.trim();
        if (!query) return;
        setStatus("searching…");
        try {
          await loadSearch(query);
          setStatus("");
        } catch (err) {
          setStatus(String(err.message || err), true);
        }
      });

      document.getElementById("refresh").addEventListener("click", async () => {
        setStatus("refreshing…");
        try {
          await loadView();
          if (state.selected && state.view !== "doctor") {
            if (state.threadTs) await openThread(state.selected.channel_id, state.threadTs);
            else await openChannel(state.selected);
          }
          setStatus("");
        } catch (err) {
          setStatus(String(err.message || err), true);
        }
      });

      document.getElementById("composer").addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = document.getElementById("draft").value;
        if (!state.selected || !text.trim() || pendingSends.has(draftKey())) return;
        const key = draftKey();
        const channel = state.selected;
        const threadTs = state.threadTs;
        pendingSends.add(key);
        document.getElementById("send").disabled = true;
        setStatus("Sending…");
        try {
          await api("/api/reply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              channel: channel.channel_id,
              text,
              thread_ts: threadTs || undefined,
            }),
          });
          if (drafts.get(key) === text) drafts.delete(key);
          if (draftKey() !== key) return;
          if (document.getElementById("draft").value === text)
            document.getElementById("draft").value = "";
          if (threadTs) await openThread(channel.channel_id, threadTs);
          else await openChannel(channel);
          setStatus("Message sent");
        } catch (err) {
          if (draftKey() === key) setStatus(String(err.message || err), true);
        } finally {
          pendingSends.delete(key);
          if (draftKey() === key) enableComposer(Boolean(state.selected));
        }
      });

      document.getElementById("mark").addEventListener("click", async () => {
        const last = state.messages[state.messages.length - 1];
        if (!state.selected || !last) return;
        setStatus("marking read…");
        try {
          await api("/api/mark", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channel: state.selected.channel_id, ts: last.ts }),
          });
          if (state.view === "inbox") await loadInbox();
          setStatus("marked read");
        } catch (err) {
          setStatus(String(err.message || err), true);
        }
      });

      document.getElementById("later").addEventListener("click", async () => {
        const last = state.messages[state.messages.length - 1];
        if (!state.selected || !last) return;
        setStatus("saving Later…");
        try {
          await api("/api/later", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channel: state.selected.channel_id, ts: last.ts }),
          });
          setStatus("saved to Later");
        } catch (err) {
          setStatus(String(err.message || err), true);
        }
      });

      renderTape();
      (async () => {
        if (!CONFIG.authenticated) return;
        try {
          await loadSession();
          await loadInbox();
        } catch (err) {
          document.getElementById("meta").textContent = "Could not connect";
          document.getElementById("workspace-name").textContent = "Connection unavailable";
          document.getElementById("queue").innerHTML =
            '<p class="error-banner">Could not connect to Slack. Open Doctor to check your session.</p>';
          document.getElementById("msgs").innerHTML = '<p class="error-banner"></p>';
          document.querySelector(".error-banner").textContent = String(err.message || err);
        }
      })();
    </script>
  </body>
</html>
