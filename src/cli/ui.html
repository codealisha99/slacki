<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox — slacki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #11151c;
        --panel: #181e28;
        --tape: #1c2430;
        --rule: #2c3648;
        --voice: #e8eef6;
        --quiet: #8a97ad;
        --ping: #e6a23c;
        --ok: #5b8f7a;
        --danger: #c45c4a;
        --focus: #7eb0d6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--void);
        color: var(--voice);
        font-family: "Source Sans 3", sans-serif;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      button,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: none;
        border: 0;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .top {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--rule);
      }
      .mark {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.04em;
      }
      .meta {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--quiet);
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .amber {
        color: var(--ping);
      }
      .shell {
        display: grid;
        grid-template-columns: minmax(240px, 300px) 1fr;
        min-height: 0;
      }
      .queue {
        border-right: 1px solid var(--rule);
        overflow: auto;
        padding: 12px 10px 24px;
      }
      .queue h2,
      .tape-head h2 {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--quiet);
        padding: 8px 8px 10px;
      }
      .ticket {
        width: 100%;
        text-align: left;
        padding: 10px 10px 10px 14px;
        border-left: 3px solid transparent;
        margin-bottom: 4px;
        background: var(--panel);
      }
      .ticket:hover {
        background: var(--tape);
      }
      .ticket.active {
        border-left-color: var(--ping);
        background: var(--tape);
      }
      .ticket.mention {
        border-left-color: var(--ping);
      }
      .ticket-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 600;
        font-size: 15px;
      }
      .count {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--quiet);
      }
      .snippet {
        margin-top: 4px;
        color: var(--quiet);
        font-size: 13px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tape {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 0;
        background: var(--tape);
      }
      .tape-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--rule);
        padding-right: 12px;
      }
      .msgs {
        overflow: auto;
        padding: 8px 0 24px;
      }
      .row {
        display: grid;
        grid-template-columns: 108px 1fr;
        gap: 12px;
        padding: 10px 20px;
        border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent);
      }
      .row.threadable {
        cursor: pointer;
      }
      .row.threadable:hover {
        background: color-mix(in srgb, var(--ping) 6%, transparent);
      }
      .ts {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--quiet);
        padding-top: 3px;
      }
      .who {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--ping);
        margin-bottom: 4px;
      }
      .body {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 15px;
        line-height: 1.45;
      }
      .thread-tag {
        margin-top: 6px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--ok);
      }
      .composer {
        border-top: 1px solid var(--rule);
        padding: 12px 16px 16px;
        display: grid;
        gap: 8px;
        background: var(--panel);
      }
      textarea {
        width: 100%;
        min-height: 88px;
        resize: vertical;
        background: var(--void);
        border: 1px solid var(--rule);
        padding: 10px 12px;
        border-radius: 0;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .go,
      .ghost {
        padding: 8px 14px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 600;
        font-size: 14px;
      }
      .go {
        background: var(--ok);
        color: #0c1210;
      }
      .go:disabled,
      .ghost:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .ghost {
        border: 1px solid var(--rule);
        color: var(--voice);
      }
      .status {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--quiet);
        min-height: 1.2em;
      }
      .status.err {
        color: var(--danger);
      }
      .empty,
      .error-banner {
        padding: 24px 20px;
        color: var(--quiet);
        max-width: 36em;
      }
      .error-banner {
        color: var(--danger);
      }
      @media (max-width: 760px) {
        .shell {
          grid-template-columns: 1fr;
          grid-template-rows: 38vh 1fr;
        }
        .queue {
          border-right: 0;
          border-bottom: 1px solid var(--rule);
        }
        .row {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="mark">Inbox</div>
      <div class="meta" id="meta">connecting…</div>
    </header>
    <main class="shell">
      <aside class="queue">
        <h2>Queue</h2>
        <div id="queue"></div>
      </aside>
      <section class="tape">
        <div class="tape-head">
          <h2 id="tape-title">Select a conversation</h2>
          <button class="ghost" type="button" id="refresh">Refresh</button>
        </div>
        <div class="msgs" id="msgs">
          <p class="empty">
            Unreads land here as a tape. Pick a conversation, read it, reply, then mark it read.
            This window is the human — sending from here is you, not the agent.
          </p>
        </div>
        <form class="composer" id="composer">
          <textarea id="draft" placeholder="Reply in this conversation…" disabled></textarea>
          <div class="actions">
            <button class="go" type="submit" id="send" disabled>Send</button>
            <button class="ghost" type="button" id="mark" disabled>Mark read</button>
          </div>
          <p class="status" id="status"></p>
        </form>
      </section>
    </main>
    <script>
      const CONFIG = __INBOX_CONFIG__;
      const token = CONFIG.token;
      const state = {
        session: null,
        unreads: [],
        source: "unreads",
        selected: null,
        messages: [],
        mode: "history",
        threadTs: null,
      };

      function headers(extra) {
        return { "x-inbox-token": token, ...(extra || {}) };
      }

      async function api(path, init) {
        const res = await fetch(path, { ...init, headers: headers(init && init.headers) });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || res.statusText);
        }
        return data;
      }

      function clock(ts) {
        if (!ts) return "";
        const ms = Number.parseFloat(ts) * 1000;
        if (!Number.isFinite(ms)) return ts;
        return new Date(ms).toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function channelLabel(ch) {
        if (ch.channel_type === "dm") return ch.channel_name || "direct";
        return ch.channel_name ? "#" + ch.channel_name : ch.channel_id;
      }

      function lastSnippet(ch) {
        const msgs = ch.messages || [];
        const last = msgs[msgs.length - 1];
        return last && last.content ? last.content : "";
      }

      function setStatus(text, err) {
        const el = document.getElementById("status");
        el.textContent = text || "";
        el.className = "status" + (err ? " err" : "");
      }

      function renderQueue() {
        const root = document.getElementById("queue");
        if (!state.unreads.length) {
          root.innerHTML =
            '<p class="empty">No unreads. If Slack has mail, refresh — or run doctor if auth looks wrong.</p>';
          return;
        }
        root.replaceChildren(
          ...state.unreads.map((ch) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className =
              "ticket" +
              (state.selected === ch.channel_id ? " active" : "") +
              (ch.mention_count > 0 ? " mention" : "");
            btn.innerHTML =
              '<div class="ticket-top"><span></span><span class="count"></span></div><div class="snippet"></div>';
            btn.querySelector(".ticket-top span").textContent = channelLabel(ch);
            btn.querySelector(".count").textContent =
              (ch.mention_count ? ch.mention_count + " @ · " : "") + ch.unread_count;
            btn.querySelector(".snippet").textContent = lastSnippet(ch);
            btn.addEventListener("click", () => openChannel(ch));
            return btn;
          }),
        );
      }

      function renderTape() {
        const title = document.getElementById("tape-title");
        const msgs = document.getElementById("msgs");
        const ch = state.unreads.find((c) => c.channel_id === state.selected);
        title.textContent = ch
          ? channelLabel(ch) + (state.mode === "thread" ? " · thread" : "")
          : "Select a conversation";
        if (!state.messages.length) {
          msgs.innerHTML = ch
            ? '<p class="empty">No messages in this slice.</p>'
            : document.querySelector(".empty")
              ? ""
              : '<p class="empty">Pick a conversation from the queue.</p>';
          if (!ch) {
            msgs.innerHTML =
              '<p class="empty">Unreads land here as a tape. Pick a conversation, read it, reply, then mark it read.</p>';
          }
          return;
        }
        msgs.replaceChildren(
          ...state.messages.map((m) => {
            const row = document.createElement("article");
            const threaded = Boolean(m.thread_ts);
            row.className = "row" + (threaded ? " threadable" : "");
            const author = (m.author && (m.author.user_id || m.author.bot_id)) || "unknown";
            row.innerHTML =
              '<div class="ts"></div><div><div class="who"></div><div class="body"></div>' +
              (m.thread_ts ? '<div class="thread-tag"></div>' : "") +
              "</div>";
            row.querySelector(".ts").textContent = clock(m.ts);
            row.querySelector(".who").textContent = author;
            row.querySelector(".body").textContent = m.content || "";
            if (m.thread_ts) {
              const tag = row.querySelector(".thread-tag");
              tag.textContent =
                state.mode === "thread"
                  ? "in thread"
                  : m.ts === m.thread_ts
                    ? "open thread"
                    : "part of a thread — click to open";
              row.addEventListener("click", () => openThread(ch.channel_id, m.thread_ts || m.ts));
            }
            return row;
          }),
        );
        msgs.scrollTop = msgs.scrollHeight;
      }

      function enableComposer(on) {
        document.getElementById("draft").disabled = !on;
        document.getElementById("send").disabled = !on;
        document.getElementById("mark").disabled = !on;
      }

      async function loadSession() {
        state.session = await api("/api/session");
        const bits = [
          state.session.team || state.session.workspace_url,
          state.session.user ? "@" + state.session.user : null,
          state.session.safe_mode ? "safe mode · sending here is still you" : null,
        ].filter(Boolean);
        document.getElementById("meta").innerHTML = bits
          .map((b, i) =>
            i === bits.length - 1 && state.session.safe_mode
              ? '<span class="amber">' + b + "</span>"
              : b,
          )
          .join(" · ");
      }

      async function loadUnreads() {
        const data = await api("/api/unreads");
        state.unreads = data.channels || [];
        state.source = data.source || "unreads";
        document.querySelector(".queue h2").textContent =
          state.source === "recent" ? "Recent" : "Queue";
        renderQueue();
      }

      async function openChannel(ch) {
        state.selected = ch.channel_id;
        state.mode = "history";
        state.threadTs = null;
        enableComposer(true);
        renderQueue();
        setStatus("loading tape…");
        try {
          const data = await api("/api/history?channel=" + encodeURIComponent(ch.channel_id));
          state.messages = data.messages || [];
          renderTape();
          setStatus("");
        } catch (err) {
          setStatus(String(err.message || err), true);
        }
      }

      async function openThread(channelId, ts) {
        state.mode = "thread";
        state.threadTs = ts;
        setStatus("loading thread…");
        try {
          const data = await api(
            "/api/thread?channel=" +
              encodeURIComponent(channelId) +
              "&ts=" +
              encodeURIComponent(ts),
          );
          state.messages = data.messages || [];
          renderTape();
          setStatus("replying in thread");
        } catch (err) {
          setStatus(String(err.message || err), true);
        }
      }

      document.getElementById("refresh").addEventListener("click", async () => {
        setStatus("refreshing queue…");
        try {
          await loadUnreads();
          if (state.selected) {
            const ch = state.unreads.find((c) => c.channel_id === state.selected);
            if (ch) await openChannel(ch);
          }
          setStatus("");
        } catch (err) {
          setStatus(String(err.message || err), true);
        }
      });

      document.getElementById("composer").addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = document.getElementById("draft").value;
        if (!state.selected || !text.trim()) return;
        document.getElementById("send").disabled = true;
        setStatus("sending…");
        try {
          await api("/api/reply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              channel: state.selected,
              text,
              thread_ts: state.threadTs || undefined,
            }),
          });
          document.getElementById("draft").value = "";
          if (state.threadTs) {
            await openThread(state.selected, state.threadTs);
          } else {
            const ch = state.unreads.find((c) => c.channel_id === state.selected);
            if (ch) await openChannel(ch);
          }
          setStatus("sent");
        } catch (err) {
          setStatus(String(err.message || err), true);
        } finally {
          enableComposer(Boolean(state.selected));
        }
      });

      document.getElementById("mark").addEventListener("click", async () => {
        const last = state.messages[state.messages.length - 1];
        if (!state.selected || !last) return;
        setStatus("marking read…");
        try {
          await api("/api/mark", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channel: state.selected, ts: last.ts }),
          });
          await loadUnreads();
          setStatus("marked read");
        } catch (err) {
          setStatus(String(err.message || err), true);
        }
      });

      (async () => {
        try {
          await loadSession();
          await loadUnreads();
        } catch (err) {
          document.getElementById("meta").textContent = "could not connect";
          document.getElementById("msgs").innerHTML = '<p class="error-banner"></p>';
          document.querySelector(".error-banner").textContent = String(err.message || err);
        }
      })();
    </script>
  </body>
</html>
